[project]
name = "cadfs"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai[openai]>=1.0.5",
    "openai>=1.107.1",
    "pydantic>=2.11.7",
    "logfire[pydantic-ai]>=4.6.0",
    "python-dotenv>=1.1.1",
    "tqdm>=4.67.1",
    "requests>=2.32.0",
    "ruff>=0.15.10",
    "trimesh==4.6.13",
    "scikit-image==0.26.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11"
]

[project.optional-dependencies]
inference = [
    "vllm==0.10.2",
    "qwen-vl-utils==0.0.14",
    "transformers>=4.55,<5.0",
    "flash-attn==2.7.2.post1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/annotations/prompts.py" = ["E501"]

[tool.ruff.format]
quote-style = "single"